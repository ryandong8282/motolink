name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  miniprogram-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: find apps/miniprogram/miniprogram -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validate Mini Program structure
        run: node tools/validate-miniprogram.mjs

  api-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify API
        run: mvn --batch-mode --no-transfer-progress verify
