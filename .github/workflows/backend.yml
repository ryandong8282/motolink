name: Backend

on:
  pull_request:
    paths:
      - "services/api/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "services/api/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile and test
        run: mvn -B -f services/api/pom.xml test
