name: One-shot MVP scaffold bootstrap

on:
  push:
    branches: [feat/mvp-scaffold]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate repository files
        run: python scripts/bootstrap_scaffold.py
      - name: Commit generated scaffold
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "feat: generate MotoLink MVP scaffold"
            git push
          fi
