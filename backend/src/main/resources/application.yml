server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: motolink-api
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:motolink}
    username: ${POSTGRES_USER:motolink}
    password: ${POSTGRES_PASSWORD:motolink_dev}
    hikari:
      connection-timeout: 2000
      initialization-fail-timeout: -1
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1500ms
  flyway:
    enabled: ${FLYWAY_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

motolink:
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  floor-lease-seconds: ${FLOOR_LEASE_SECONDS:20}
  demo-mode: ${DEMO_MODE:true}
