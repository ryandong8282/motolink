name: riding_core
description: Native lifecycle, audio session and background ride bridge for MotoLink.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.29.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.motolink.riding_core
        pluginClass: RidingCorePlugin
      ios:
        pluginClass: RidingCorePlugin
