services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: motolink
      POSTGRES_USER: motolink
      POSTGRES_PASSWORD: motolink_dev
    ports:
      - "5432:5432"
    volumes:
      - motolink_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motolink -d motolink"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - motolink_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  motolink_pg:
  motolink_redis:
