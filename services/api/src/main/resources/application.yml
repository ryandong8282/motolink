server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: motolink-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/motolink}
    username: ${DB_USERNAME:motolink}
    password: ${DB_PASSWORD:motolink_dev_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

motolink:
  seed-demo: ${MOTOLINK_SEED_DEMO:true}
  cors-origins: ${MOTOLINK_CORS_ORIGINS:http://localhost:5173,http://localhost:8081}
