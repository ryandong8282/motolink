services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-motolink}
      POSTGRES_USER: ${POSTGRES_USER:-motolink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-motolink_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - motolink-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-motolink} -d ${POSTGRES_DB:-motolink}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - motolink-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  motolink-postgres:
  motolink-redis:
